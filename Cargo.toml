[package]
name = "logs-bot-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
dotenv = "0.15.0"
env_logger = "0.11.10"
log = "0.4.29"
serde = "1.0.228"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] } 
teloxide = { version = "0.17.0", features = ["macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros"] }
teloxide_tests = "0.4.0"
